[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-hub"
version = "1.0.0"
description = "Nexus Hub - AI/ML Developer Tools for Multi-Agent Swarm Orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["ai", "machine-learning", "swarm", "agents", "orchestration", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.1",
  "psycopg2-binary==2.9.10",
  "python-jose[cryptography]==3.4.0",
  "python-multipart==0.0.20",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "fakeredis==2.21.1",
  "redis==5.2.1",
  "numpy==2.1.3",
  "sentence-transformers==3.3.1",
  "torch==2.5.1; extra_index_url=https://download.pytorch.org/whl/cpu",
  "hnswlib==0.8.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "httpx==0.28.1",
  "ruff==0.5.6",
  "mypy==1.10.0",
  "types-psycopg2==2.9.10",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/nexus-hub-alan-vo"
Repository = "https://github.com/ALANDVO/nexus-hub-alan-vo"
Issues = "https://github.com/ALANDVO/nexus-hub-alan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM102", "SIM103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true