name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest backend/tests -v --tb=short

  frontend-test:
    name: Frontend Typecheck, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          load: true

  validate:
    name: Validate Required Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "portfolio.json"
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "pyproject.toml"
            ".gitignore"
            ".env.example"
            "compose.yaml"
            "backend/requirements.txt"
            "backend/Dockerfile"
            "backend/app/main.py"
            "frontend/Dockerfile"
            "frontend/package.json"
            "frontend/package-lock.json"
            ".github/workflows/ci.yml"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate portfolio.json schema
        run: |
          python3 -c "
          import json
          with open('portfolio.json') as f:
            data = json.load(f)
          assert data.get('schema_version') == 1
          assert data.get('name') == 'nexus-hub-alan-vo'
          assert data.get('owner') == 'ALANDVO'
          assert data.get('email') == 'alanvo@gmail.com'
          assert len(data.get('workflows', [])) >= 3
          assert data.get('auth') == 'oidc-keycloak-saml-broker'
          assert 'openai-compatible' in data.get('llm_providers', [])
          print('portfolio.json validation passed')
          "